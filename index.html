<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Quer namorar comigo?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', sans-serif;
      background-color: #ffe6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    h1, #finalMessage {
      font-size: 2rem;
      color: #d6336c;
      margin-bottom: 2rem;
      transition: opacity 1s ease;
    }

    #finalMessage {
      display: none;
      opacity: 0;
    }

    .buttons {
      position: relative;
      width: 300px;
      height: 200px;
      transition: opacity 1s ease;
    }

    button {
      padding: 10px 20px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #yesBtn {
      background-color: #ff69b4;
      color: white;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;
    }

    #noBtn {
      background-color: #ff4d4d;
      color: white;
      position: absolute;
      top: 50px;
      left: 50px;
    }

    #cuteGif {
      display: none;
      max-width: 300px;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 1.5s ease, margin-top 1s ease;
    }

    .fade-out {
      opacity: 0;
    }

    .fade-in {
      display: block !important;
      opacity: 1 !important;
    }

    @media (max-width: 500px) {
      h1, #finalMessage {
        font-size: 1.5rem;
      }

      .buttons {
        width: 90vw;
        height: 60vh;
      }

      #cuteGif {
        max-width: 80vw;
      }
    }

    /* Corações flutuando */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: url('https://emojicdn.elk.sh/❤️') no-repeat center/contain;
      animation: floatUp 5s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1 id="mainTitle">Quer namorar comigo? 💘</h1>

  <div class="buttons" id="buttonArea">
    <button id="yesBtn">Sim!</button>
    <button id="noBtn">Não</button>
  </div>

  <h1 id="finalMessage">AGORA VOCÊ É MINHA NAMORADA 💖</h1>

  <img id="cuteGif" src="tenor.gif" alt="Gif fofo" />

  <audio id="loveSong" src="musica/ILLIT - ‘Magnetic' Dance Cover ｜ Ellen and Brian.mp3"></audio>

  <script>
    const noBtn = document.getElementById("noBtn");
    const buttonsContainer = document.querySelector(".buttons");
    const loveSong = document.getElementById("loveSong");
    const finalMessage = document.getElementById("finalMessage");
    const gif = document.getElementById("cuteGif");
    const mainTitle = document.getElementById("mainTitle");

    noBtn.addEventListener("mouseenter", moveButton);
    noBtn.addEventListener("touchstart", moveButton);

    function moveButton() {
      const containerRect = buttonsContainer.getBoundingClientRect();
      const maxX = containerRect.width - noBtn.offsetWidth;
      const maxY = containerRect.height - noBtn.offsetHeight;

      const newX = Math.random() * maxX;
      const newY = Math.random() * maxY;

      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
    }

    document.getElementById("yesBtn").addEventListener("click", () => {
      loveSong.play();

      // Transições
      mainTitle.classList.add("fade-out");
      buttonsContainer.classList.add("fade-out");

      setTimeout(() => {
        mainTitle.style.display = "none";
        buttonsContainer.style.display = "none";

        finalMessage.classList.add("fade-in");
        gif.classList.add("fade-in");
        gif.style.marginTop = "0";

        // Começar corações
        startHearts();
      }, 1000);
    });

    function startHearts() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }, 300);
    }
  </script>
</body>
</html>
